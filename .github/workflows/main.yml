name: Mobile

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mobile"
  cancel-in-progress: true

jobs:
  version-android:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.set-version.outputs.VERSION }}
      VERSION_CODE: ${{ steps.set-version.outputs.VERSION_CODE }}
    steps:
    - uses: actions/checkout@v4
      with:
       repository: flavourous/build
       ref: 'main'
       token:  ${{ secrets.PRIVATE_GITHUB_TOKEN }}
    - run: |
        dotnet build
        v=$(dotnet run "tagtag" 0 0 0 Build false)
        echo "VERSION=$v" >> $GITHUB_OUTPUT
        echo "VERSION_CODE=${v##*.}" >> $GITHUB_OUTPUT
      id: set-version
      working-directory: store/cli
  build-android:
    runs-on: ubuntu-latest
    needs: version-android
    steps:
    - name: Delete workflow runs
      uses: dmvict/clean-workflow-runs@v1.0.0
      with:
        token: ${{ secrets.PRIVATE_GITHUB_TOKEN }}
        repo: flavourous/TagTag
        save_period: 1
        save_min_runs_number: 10
    - uses: actions/checkout@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.PRIVATE_GITHUB_TOKEN }}
    - name: build
      run: docker build . -f dockerfile --build-arg config=Release --build-arg version=${{ needs.version-android.outputs.VERSION }} --build-arg versionCode=${{ needs.version-android.outputs.VERSION_CODE }} -o out
    - name: upload apk
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: out/com.flavourous.tagtag-Signed.apk
    - name: upload icon
      uses: actions/upload-artifact@v4
      with:
        name: icon
        path: TagTag.Android/Icon.png
  deploy-android:
    needs: build-android
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  publish-android:
    runs-on: ubuntu-latest
    needs: deploy-android
    steps:
    - uses: actions/checkout@v4
      with:
       repository: flavourous/build
       ref: 'main'
       token:  ${{ secrets.PRIVATE_GITHUB_TOKEN }}
    - name: setup git config
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
    - uses: actions/download-artifact@v4
      with:
        name: icon
        path: assets
    - run: dotnet run "tagtag" "TagTag helps you organize your notes and tags" "$(base64 ../../assets/Icon.png)" "https://flavourous.github.io/TagTag/com.flavourous.tagtag-Signed.apk" "Build" "true"
      working-directory: store/cli
    - run: git add store
    - run: git commit -m "tagtag build"
    - run: git push
